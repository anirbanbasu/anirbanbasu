name: Metrics
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Basic account metrics (header, activity, community, repositories)
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/profile.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: anirbanbasu
          template: classic
          config_timezone: Asia/Tokyo
          base: "header, activity, community, repositories"

      # Detailed language breakdown
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: anirbanbasu
          template: classic
          config_timezone: Asia/Tokyo
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot

      # Lines of code added/removed across repositories
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: anirbanbasu
          template: classic
          config_timezone: Asia/Tokyo
          base: ""
          plugin_lines: yes

      # Follow-up on issues and pull requests
      - uses: lowlighter/metrics@latest
        with:
          filename: metrics/followup.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: anirbanbasu
          template: classic
          config_timezone: Asia/Tokyo
          base: ""
          plugin_followup: yes
